<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chem Resolver</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    (function(){
      var t=localStorage.getItem('chemres-theme')||
            (window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
      document.documentElement.setAttribute('data-theme',t);
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/smiles-drawer@2/dist/smiles-drawer.min.js"></script>
</head>
<body>
  <div class="page-wrap">
    <header class="site-header">
      <svg class="site-header-hex" viewBox="0 0 100 100" fill="none" stroke="currentColor" aria-hidden="true">
        <polygon points="50,4 93,27.5 93,72.5 50,96 7,72.5 7,27.5" stroke-width="1.5"/>
        <circle cx="50" cy="50" r="24" stroke-width="1"/>
      </svg>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
        <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <h1><span class="h1-primary">Chem</span><span class="h1-validator">&nbsp;&nbsp;Resolver</span></h1>
      <p>Resolve chemical identifiers via the PubChem REST API</p>
    </header>

    <section class="card">
      <p class="card-title">Single Lookup</p>
      <button class="card-reset" id="lookup-reset" aria-label="Clear"
              onclick="document.getElementById('lookup-form').reset();
                       document.getElementById('lookup-result').innerHTML='';
                       document.getElementById('lookup-suggestions').innerHTML='';
                       this.style.display='none';"
              style="display:none">
        {{template "icon/rotate-ccw" .}}
        Clear
      </button>
      <form id="lookup-form"
            hx-post="/resolve"
            hx-target="#lookup-result"
            hx-swap="innerHTML"
            hx-indicator="#lookup-indicator, #lookup-resolve-spinner"
            hx-on:submit="document.getElementById('lookup-reset').style.display='flex';
                          document.getElementById('lookup-suggestions').innerHTML='';">
        <label for="lookup-input">Chemical Identifier</label>
        <div class="input-row">
          <div class="input-wrap">
            <input type="text" id="lookup-input" name="input"
                   placeholder="e.g. CCO · acetone · 64-17-5 · LFQSCWFLJHTTHZ-UHFFFAOYSA-N"
                   autocomplete="off" spellcheck="false"
                   hx-get="/suggest"
                   hx-trigger="input changed delay:300ms"
                   hx-target="#lookup-suggestions"
                   hx-swap="innerHTML"
                   hx-include="this"
                   hx-params="input"
                   hx-indicator="#lookup-suggest-spinner"
                   hx-on:htmx:after-swap="var d=document.getElementById('lookup-suggestions'); if(!d.textContent.trim()) d.innerHTML='';"
                   onclick="document.getElementById('lookup-suggestions').innerHTML=''"
                   onblur="setTimeout(function(){document.getElementById('lookup-suggestions').innerHTML=''},200)">
            <div id="lookup-suggestions" class="suggest-dropdown"></div>
            <div class="input-spinner" id="lookup-suggest-spinner"></div>
            <div class="input-spinner" id="lookup-resolve-spinner"></div>
          </div>
          <button class="btn" type="submit">Resolve</button>
          <span id="lookup-indicator" class="indicator" aria-live="polite">Resolving</span>
        </div>
      </form>
      <div id="lookup-result"></div>
    </section>

    <section class="card">
      <p class="card-title">Batch</p>
      <button class="card-reset" id="batch-reset" aria-label="Clear"
              onclick="document.getElementById('batch-form').reset();
                       document.getElementById('batch-result').innerHTML='';
                       this.style.display='none';"
              style="display:none">
        {{template "icon/rotate-ccw" .}}
        Clear
      </button>
      <form id="batch-form"
            hx-post="/batch"
            hx-target="#batch-result"
            hx-swap="innerHTML"
            hx-indicator="#batch-indicator, #batch-progress"
            hx-encoding="multipart/form-data"
            hx-on:submit="document.getElementById('batch-reset').style.display='flex';
                          document.getElementById('batch-result').innerHTML='';">
        <label for="batch-inputs">Identifiers (one per line)</label>
        <textarea id="batch-inputs" name="inputs" rows="5"
                  placeholder="CCO&#10;acetone&#10;64-17-5&#10;LFQSCWFLJHTTHZ-UHFFFAOYSA-N"
                  spellcheck="false"></textarea>
        <p class="hint">Accepts SMILES, names, CAS numbers, and InChIKeys. Or upload a plain text file:</p>
        <div class="input-row">
          <input type="file" name="file" accept=".txt,.csv" style="flex:1;margin-bottom:0;align-self:center">
          <button class="btn" type="submit">Resolve All</button>
          <span id="batch-indicator" class="indicator">Processing</span>
        </div>
      </form>
      <div class="progress-bar" id="batch-progress"></div>
      <div id="batch-result"></div>
    </section>
  </div>

  <!-- Structure modal -->
  <div id="structure-modal" class="modal-overlay" style="display:none" onclick="closeStructureModal(event)">
    <div class="modal-box">
      <div class="modal-header">
        <span id="modal-name" class="modal-title"></span>
        <div class="modal-actions">
          <button id="modal-dl-btn" class="btn btn-sm">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px">
              <path d="M8 2v8M5 7l3 3 3-3"/><line x1="2" y1="13" x2="14" y2="13"/>
            </svg>
            SVG
          </button>
          <button class="modal-close" onclick="closeStructureModal()">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:12px;height:12px">
              <line x1="2" y1="2" x2="14" y2="14"/><line x1="14" y1="2" x2="2" y2="14"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="modal-structure" class="modal-structure"></div>
    </div>
  </div>

  <footer class="site-footer">
    <span><a href="https://pubchem.ncbi.nlm.nih.gov/" target="_blank" rel="noopener">PubChem REST API</a></span>
    <span><a href="https://github.com/reymond-group/smilesDrawer" target="_blank" rel="noopener">SmilesDrawer</a></span>
    <a href="https://github.com/roncofaber/chemres" target="_blank" rel="noopener">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="width:13px;height:13px;vertical-align:middle;margin-right:0.2rem;">
        <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/>
      </svg>GitHub</a>
  </footer>

  <script>
  function toggleTheme() {
    var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('chemres-theme', next);
  }

  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }

  function downloadSvg(svgEl, name) {
    var src = new XMLSerializer().serializeToString(svgEl);
    if (!src.match(/xmlns=/)) src = src.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
    var blob = new Blob([src], {type: 'image/svg+xml;charset=utf-8'});
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href   = url;
    a.download = (name || 'structure').replace(/[^\w-]/g, '_').substring(0, 60) + '.svg';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function openStructureModal(smiles, name) {
    var modal  = document.getElementById('structure-modal');
    var cont   = document.getElementById('modal-structure');
    document.getElementById('modal-name').textContent = name || smiles;
    cont.innerHTML = '';
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';

    var largest = smiles.split('.').reduce(function(a, b) { return a.length >= b.length ? a : b; });
    var drawer  = new SmilesDrawer.SmiDrawer({ width: 420, height: 360, padding: 24, bondThickness: 1.6, isomeric: true, explicitHydrogens: false });
    drawer.draw(largest, null, currentTheme(), function(svgEl) {
      cont.appendChild(svgEl);
      document.getElementById('modal-dl-btn').onclick = function() { downloadSvg(svgEl, name); };
    }, function() {
      cont.innerHTML = '<p style="color:var(--error-text);padding:1rem;font-family:var(--font-mono);font-size:0.8rem">Could not render structure.</p>';
    });
  }

  function closeStructureModal(evt) {
    if (evt && evt.target !== document.getElementById('structure-modal')) return;
    document.getElementById('structure-modal').style.display = 'none';
    document.body.style.overflow = '';
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      document.getElementById('structure-modal').style.display = 'none';
      document.body.style.overflow = '';
    }
  });

  function drawStructure(el) {
    if (!el || typeof SmilesDrawer === 'undefined') return;
    var smiles  = el.getAttribute('data-smiles');
    var name    = el.getAttribute('data-name') || smiles;
    var largest = smiles.split('.').reduce(function(a, b) { return a.length >= b.length ? a : b; });
    var drawer  = new SmilesDrawer.SmiDrawer({ width: 160, height: 140, padding: 10, bondThickness: 1.2, isomeric: true, explicitHydrogens: false });
    drawer.draw(largest, null, currentTheme(), function(svgEl) {
      el.innerHTML = '';
      el.appendChild(svgEl);

      var dlBtn = document.createElement('button');
      dlBtn.className = 'structure-dl';
      dlBtn.title = 'Download SVG';
      dlBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M5 7l3 3 3-3"/><line x1="2" y1="13" x2="14" y2="13"/></svg>';
      dlBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        downloadSvg(svgEl, name);
      });
      el.appendChild(dlBtn);

      el.style.display  = '';
      el.style.cursor   = 'zoom-in';
      el.addEventListener('click', function() { openStructureModal(smiles, name); });
    }, function() { /* keep hidden */ });
  }

  // ── Suggestion keyboard navigation ──────────────────────────
  var _sugIdx = -1;

  function _sugItems() {
    return Array.from(document.querySelectorAll('#lookup-suggestions .suggest-item'));
  }

  function _sugHighlight(items, idx) {
    items.forEach(function(el, i) {
      el.classList.toggle('suggest-item--active', i === idx);
    });
    if (idx >= 0 && items[idx]) items[idx].scrollIntoView({block: 'nearest'});
  }

  document.addEventListener('keydown', function(e) {
    if (document.activeElement !== document.getElementById('lookup-input')) return;
    var items = _sugItems();
    if (!items.length) { _sugIdx = -1; return; }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      _sugIdx = Math.min(_sugIdx + 1, items.length - 1);
      _sugHighlight(items, _sugIdx);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      _sugIdx = Math.max(_sugIdx - 1, -1);
      _sugHighlight(items, _sugIdx);
    } else if (e.key === 'Enter' && _sugIdx >= 0) {
      e.preventDefault();
      items[_sugIdx].dispatchEvent(new MouseEvent('mousedown', {bubbles: true}));
      _sugIdx = -1;
    } else if (e.key === 'Escape') {
      document.getElementById('lookup-suggestions').innerHTML = '';
      _sugIdx = -1;
    }
  });

  document.addEventListener('htmx:afterSwap', function(evt) {
    if (evt.detail && evt.detail.target &&
        evt.detail.target.id === 'lookup-suggestions') {
      _sugIdx = -1;
    }
  });

  document.addEventListener('htmx:afterSettle', function() {
    document.querySelectorAll('.structure-wrap[data-smiles]:not([data-sd-rendered])').forEach(function(el) {
      el.setAttribute('data-sd-rendered', '1');
      drawStructure(el);
    });
  });
  </script>
</body>
</html>
