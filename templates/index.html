<!DOCTYPE html>
<html lang="en" data-theme="{{.Theme}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChemRes — Chemical Resolver</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,4 93,27.5 93,72.5 50,96 7,72.5 7,27.5' fill='none' stroke='%2322d3ee' stroke-width='9' stroke-linejoin='round'/><circle cx='50' cy='50' r='23' fill='none' stroke='%2322d3ee' stroke-width='7'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/style.css?v={{.Version}}">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script src="https://unpkg.com/smiles-drawer@2/dist/smiles-drawer.min.js" defer></script>
  <script src="/static/app.js?v={{.Version}}" defer></script>
</head>
<body>
  <div class="page-wrap">
    <header class="site-header">
      <svg class="site-header-hex" viewBox="0 0 100 100" fill="none" stroke="currentColor" aria-hidden="true">
        <polygon points="50,4 93,27.5 93,72.5 50,96 7,72.5 7,27.5" stroke-width="1.5"/>
        <circle cx="50" cy="50" r="24" stroke-width="1"/>
      </svg>
      <button class="theme-toggle" title="Toggle theme">
        <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <h1><span class="h1-primary">Chemical</span><span class="h1-validator">&nbsp;&nbsp;Resolver</span></h1>
      <p>Resolve chemical identifiers via the PubChem REST API</p>
    </header>

    <section class="card">
      <button class="card-reset" id="lookup-reset" aria-label="Clear" style="display:none">
        {{template "icon/rotate-ccw" .}}
        Clear
      </button>
      <form id="lookup-form"
            hx-post="/resolve"
            hx-target="#lookup-result"
            hx-swap="innerHTML"
            hx-indicator="#lookup-indicator, #lookup-resolve-spinner">
        <label for="lookup-input">Chemical Identifier</label>
        <div class="input-row">
          <div class="input-wrap">
            <input type="text" id="lookup-input" name="input"
                   placeholder="e.g. CCO · acetone · 64-17-5 · LFQSCWFLJHTTHZ-UHFFFAOYSA-N"
                   autocomplete="off" spellcheck="false"
                   role="combobox" aria-autocomplete="list" aria-expanded="false"
                   aria-controls="lookup-suggestions" aria-haspopup="listbox"
                   hx-get="/suggest"
                   hx-trigger="input changed delay:300ms"
                   hx-target="#lookup-suggestions"
                   hx-swap="innerHTML"
                   hx-include="this"
                   hx-params="input"
                   hx-indicator="#lookup-suggest-spinner">
            <div id="lookup-suggestions" class="suggest-dropdown" role="listbox" aria-label="Suggestions"></div>
            <div class="input-spinner" id="lookup-suggest-spinner"></div>
            <div class="input-spinner" id="lookup-resolve-spinner"></div>
          </div>
          <button class="btn" type="submit">Resolve</button>
          <span id="lookup-indicator" class="indicator" aria-live="polite">Resolving</span>
        </div>
      </form>
      <div id="lookup-result"></div>
    </section>

    <section class="card">
      <p class="card-title">Batch<span class="card-title-hint-wrap"><span class="card-title-hint">ⓘ</span><span class="card-title-tooltip">Rate limited to 4 requests/s per user via PubChem API</span></span></p>
      <button class="card-reset" id="batch-reset" aria-label="Clear" style="display:none">
        {{template "icon/rotate-ccw" .}}
        Clear
      </button>
      <form id="batch-form">
        <label for="batch-inputs">Identifiers (one per line)</label>
        <textarea id="batch-inputs" name="inputs" rows="5"
                  placeholder="CCO&#10;acetone&#10;64-17-5&#10;LFQSCWFLJHTTHZ-UHFFFAOYSA-N"
                  spellcheck="false"></textarea>
        <p class="hint">Accepts SMILES, names, CAS numbers, and InChIKeys. Or upload a file:</p>
        <div class="input-row">
          <input type="file" name="file" accept=".txt,.csv,.xlsx" style="flex:1;margin-bottom:0;align-self:center">
          <button class="btn" type="submit">Resolve All</button>
        </div>
      </form>
      <div class="progress-wrap" id="batch-progress-wrap" style="display:none">
        <div class="progress-bar" id="batch-progress">
          <div class="progress-fill" id="batch-progress-fill"></div>
        </div>
        <span id="batch-indicator" class="indicator">Processing</span>
        <button class="btn-cancel-batch" id="batch-cancel" title="Cancel" style="display:none">✕</button>
      </div>
      <div id="batch-result"></div>
    </section>
  </div>

  <!-- Structure modal -->
  <div id="structure-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <span id="modal-name" class="modal-title"></span>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:12px;height:12px">
            <line x1="2" y1="2" x2="14" y2="14"/><line x1="14" y1="2" x2="2" y2="14"/>
          </svg>
        </button>
      </div>
      <div id="modal-structure" class="modal-structure"></div>
      <div class="modal-footer">
        <button id="modal-copy-btn" class="btn btn-sm btn-secondary">{{template "icon/copy" .}}{{template "icon/check" .}} PNG</button>
        <div class="str-dl-wrap" id="modal-dl-wrap">
          <button id="modal-dl-btn" class="btn btn-sm btn-secondary">↓ Download</button>
          <div id="modal-dl-menu" class="dl-menu" style="display:none">
            <button class="dl-opt" data-dl="svg">SVG</button>
            <button class="dl-opt" data-dl="png">PNG</button>
            <button class="dl-opt" data-dl="sdf">SDF 3D</button>
            <button class="dl-opt" data-dl="xyz">XYZ</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <span><a href="https://pubchem.ncbi.nlm.nih.gov/" target="_blank" rel="noopener">PubChem REST API</a></span>
    <a href="https://github.com/roncofaber/chemres" target="_blank" rel="noopener">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="width:13px;height:13px;vertical-align:middle;margin-right:0.2rem;">
        <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/>
      </svg>ChemRes {{.Version}}</a>
  </footer>
</body>
</html>
